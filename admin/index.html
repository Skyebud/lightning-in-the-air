<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07112f">
  <link rel="icon" href="../assets/icons/bolt.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="admin.css">
  <title>Band Dashboard | Lightning in the Air</title>
</head>
<body class="admin-body">
<header class="admin-topbar">
  <a class="brand" href="../index.html"><img src="../assets/icons/bolt.svg" alt=""><span><strong>Lightning in the Air</strong><small>Band dashboard</small></span></a>
  <div><span data-user-email></span><button class="button admin-small" data-sign-out>Sign out</button></div>
</header>
<main class="admin-layout">
  <aside class="admin-sidebar">
    <button class="active" data-admin-tab="overview">Overview</button>
    <button data-admin-tab="shows">Shows</button>
    <button data-admin-tab="videos">Videos</button>
    <button data-admin-tab="photos">Photos</button>
    <button data-admin-tab="members">Band members</button>
    <button data-admin-tab="settings">Site settings</button>
    <a href="../index.html" target="_blank" rel="noopener">Open website ↗</a>
  </aside>
  <section class="admin-content">
    <div data-admin-gate class="admin-gate"><h1>Checking access…</h1></div>
    <div data-admin-app hidden>
      <section class="admin-panel active" data-admin-panel="overview">
        <div class="admin-heading"><div><p class="eyebrow">Dashboard</p><h1>Manage the site.</h1></div><button class="button primary" data-seed-content>Load starter content</button></div>
        <div class="admin-stats"><article><strong data-count-shows>0</strong><span>Shows</span></article><article><strong data-count-videos>0</strong><span>Videos</span></article><article><strong data-count-photos>0</strong><span>Photos</span></article><article><strong data-count-members>0</strong><span>Members</span></article></div>
        <p class="admin-message" data-overview-message></p>
      </section>

      <section class="admin-panel" data-admin-panel="shows">
        <div class="admin-heading"><div><p class="eyebrow">Shows</p><h1>Dates.</h1></div><button class="button primary" data-new-show>New show</button></div>
        <div class="admin-two-column"><div data-show-admin-list class="admin-list"></div><form data-show-form class="admin-form"><input type="hidden" name="id"><h2 data-show-form-title>Add a show</h2><label>Listing title<input name="title" required></label><div class="form-grid"><label>Date<input type="date" name="date"></label><label>Display date override<input name="displayDate" placeholder="October 2"></label><label>Time<input name="time" placeholder="7:00 PM"></label><label>Venue<input name="venue"></label><label>City<input name="city"></label><label>State<input name="state" maxlength="2"></label></div><label>Ticket or event URL<input type="url" name="ticketUrl"></label><label>Details<textarea name="details" rows="4"></textarea></label><div class="checkbox-row"><label><input type="checkbox" name="published"> Published</label><label><input type="checkbox" name="featured"> Featured</label></div><label>Display order<input type="number" name="order" value="10"></label><div class="button-row"><button class="button dark" type="submit">Save show</button><button class="button danger" type="button" data-delete-show hidden>Delete</button></div><p class="admin-message" data-show-message></p></form></div>
      </section>

      <section class="admin-panel" data-admin-panel="videos">
        <div class="admin-heading"><div><p class="eyebrow">Videos</p><h1>YouTube.</h1></div><button class="button primary" data-new-video>New video</button></div>
        <div class="admin-two-column"><div data-video-admin-list class="admin-list"></div><form data-video-form class="admin-form"><input type="hidden" name="id"><h2 data-video-form-title>Add a video</h2><label>Title<input name="title" required></label><label>YouTube URL<input type="url" name="youtubeUrl" required></label><label>Description<textarea name="description" rows="4"></textarea></label><div class="checkbox-row"><label><input type="checkbox" name="published" checked> Published</label><label><input type="checkbox" name="featured"> Featured</label></div><label>Display order<input type="number" name="order" value="10"></label><div class="button-row"><button class="button dark" type="submit">Save video</button><button class="button danger" type="button" data-delete-video hidden>Delete</button></div><p class="admin-message" data-video-message></p></form></div>
      </section>

      <section class="admin-panel" data-admin-panel="photos">
        <div class="admin-heading"><div><p class="eyebrow">Photos</p><h1>Gallery.</h1></div><button class="button primary" data-new-photo>New photo</button></div>
        <div class="admin-two-column"><div data-photo-admin-list class="admin-list"></div><form data-photo-form class="admin-form"><input type="hidden" name="id"><input type="hidden" name="currentUrl"><input type="hidden" name="storagePath"><h2 data-photo-form-title>Add a photo</h2><label>Image file<input type="file" name="file" accept="image/jpeg,image/png,image/webp"></label><div class="upload-progress" data-photo-upload-progress hidden><span></span></div><label>Caption<input name="caption" required></label><label>Alt text<input name="alt" required></label><div class="checkbox-row"><label><input type="checkbox" name="published" checked> Published</label><label><input type="checkbox" name="featured"> Featured</label></div><label>Display order<input type="number" name="order" value="10"></label><div class="button-row"><button class="button dark" type="submit">Save photo</button><button class="button danger" type="button" data-delete-photo hidden>Delete</button></div><p class="admin-message" data-photo-message></p></form></div>
      </section>

      <section class="admin-panel" data-admin-panel="members">
        <div class="admin-heading"><div><p class="eyebrow">The Band</p><h1>Member stories.</h1></div><button class="button primary" data-new-member>New member</button></div>
        <div class="admin-two-column"><div data-member-admin-list class="admin-list"></div><form data-member-form class="admin-form"><input type="hidden" name="id"><input type="hidden" name="currentPhotoUrl"><input type="hidden" name="storagePath"><h2 data-member-form-title>Add a member</h2><label>Name<input name="name" required></label><label>Role<input name="role" required></label><label>Member photo<input type="file" name="file" accept="image/jpeg,image/png,image/webp"></label><div class="upload-progress" data-member-upload-progress hidden><span></span></div><label>Photo alt text<input name="photoAlt" required></label><label>Story<textarea name="story" rows="9" placeholder="Add the member story when it is ready."></textarea></label><div class="checkbox-row"><label><input type="checkbox" name="published" checked> Published</label></div><label>Display order<input type="number" name="order" value="10"></label><div class="button-row"><button class="button dark" type="submit">Save member</button><button class="button danger" type="button" data-delete-member hidden>Delete</button></div><p class="admin-message" data-member-message></p></form></div>
      </section>

      <section class="admin-panel" data-admin-panel="settings">
        <div class="admin-heading"><div><p class="eyebrow">Site settings</p><h1>Contact and links.</h1></div></div>
        <form data-settings-form class="admin-form wide"><label>Announcement bar<input name="announcement"></label><div class="form-grid"><label>Booking email<input type="email" name="bookingEmail"></label><label>Booking phone<input name="bookingPhone"></label><label>YouTube channel URL<input type="url" name="youtubeUrl"></label><label>Facebook URL<input type="url" name="facebookUrl"></label><label>Instagram URL<input type="url" name="instagramUrl"></label></div><label>Testimonial quote<textarea name="homeQuote" rows="3"></textarea></label><label>Testimonial attribution<input name="homeQuoteBy"></label><button class="button dark" type="submit">Save settings</button><p class="admin-message" data-settings-message></p></form>
      </section>
    </div>
  </section>
</main>
<script type="module" src="../js/admin-dashboard.js"></script>
</body>
</html>
